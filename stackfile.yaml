name: test-app

resources:
  app:
    build:
      repo: https://github.com/Stackdome/test-repo
      branch: main
      dockerfile: Dockerfile
      context: .
    ports:
      - name: http
        port: 3000
        public: true
        subdomain: test-app
    env:
      MYSQL_HOST: "{{ mysql.host }}"
      MYSQL_USER: root
      MYSQL_PASSWORD: secret
      MYSQL_DB: todos
    depends_on: [mysql]

  mysql:
    image: mysql:8.0
    ports:
      - name: mysql
        port: 3306
    env:
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_DATABASE: todos
    volumes:
      - name: mysql-data
        path: /var/lib/mysql

volumes:
  mysql-data:
    size: 5Gi
